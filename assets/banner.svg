<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-circle {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 25s linear infinite;
    }
    .floating-card-1 {
      animation: float1 7s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: float2 9s ease-in-out infinite alternate;
    }
    .floating-pill {
      animation: floatPill 6s ease-in-out infinite alternate;
    }
    .graph-wave {
      animation: waveGlow 5s ease-in-out infinite alternate;
    }

    @keyframes dash {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { r: 140px; opacity: 0.15; }
      100% { r: 210px; opacity: 0.35; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(14px) rotate(-1.5deg); }
    }
    @keyframes floatPill {
      0% { transform: translate(0, 0); }
      100% { transform: translate(8px, -10px); }
    }
    @keyframes waveGlow {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Dynamic Ambient Glow Spheres (Background) -->
  <g opacity="0.4">
    <circle cx="180" cy="80" r="160" fill="#6366f1" filter="url(#glow)" class="pulse-circle" />
    <circle cx="1020" cy="280" r="150" fill="#a855f7" filter="url(#glow)" class="pulse-circle" />
    <circle cx="900" cy="70" r="120" fill="#06b6d4" filter="url(#glow)" class="pulse-circle" />
  </g>

  <!-- Technical Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Flow Connector Curves (Behind text) -->
  <g fill="none" opacity="0.35">
    <path class="flow-line" d="M 50 320 C 300 280, 450 350, 700 300 C 900 260, 1050 320, 1180 270" stroke="#a855f7" stroke-width="2.5" />
    <path class="flow-line" d="M 100 40 C 350 90, 550 20, 800 70 C 980 110, 1100 40, 1180 80" stroke="#06b6d4" stroke-width="2" />
  </g>

  <!-- Dynamic Background Graphic: Interactive Reactive Graph / Sparkline Wave -->
  <g class="graph-wave" opacity="0.45" fill="none" stroke-linecap="round">
    <path d="M 820 220 Q 860 170 900 210 T 980 180 T 1060 220 T 1140 160" stroke="#ec4899" stroke-width="3" />
    <circle cx="900" cy="210" r="4" fill="#ec4899" />
    <circle cx="980" cy="180" r="4" fill="#a855f7" />
    <circle cx="1060" cy="220" r="4" fill="#6366f1" />
    <circle cx="1140" cy="160" r="5" fill="#06b6d4" />
  </g>

  <!-- Dynamic Animated Floating Cards (Right Side Accent - Stays distinct from foreground text) -->
  <g class="floating-card-1">
    <rect x="910" y="80" width="220" height="72" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="935" cy="116" r="14" fill="#10b981" fill-opacity="0.2" />
    <text x="935" y="121" fill="#10b981" font-size="14" font-weight="bold" text-anchor="middle">In</text>
    <text x="960" y="110" fill="#f8fafc" font-size="12" font-weight="600">Reactive Execution</text>
    <text x="960" y="128" fill="#94a3b8" font-size="11">marimo • DuckDB SQL</text>
  </g>

  <g class="floating-card-2">
    <rect x="850" y="240" width="240" height="72" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="875" cy="276" r="14" fill="#6366f1" fill-opacity="0.2" />
    <text x="875" y="281" fill="#818cf8" font-size="14" font-weight="bold" text-anchor="middle">Py</text>
    <text x="900" y="270" fill="#f8fafc" font-size="12" font-weight="600">Lakehouse &amp; Cloud</text>
    <text x="900" y="288" fill="#94a3b8" font-size="11">Snowflake • Databricks • Colab</text>
  </g>

  <!-- Dynamic Animated Floating Pills (Left & Center Accents) -->
  <g class="floating-pill">
    <rect x="80" y="38" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.85" />
    <circle cx="95" cy="52" r="5" fill="#06b6d4" />
    <text x="108" y="56" fill="#cbd5e1" font-size="11" font-weight="600">JupyterLab 4.x</text>
  </g>

  <g class="floating-pill">
    <rect x="680" y="42" width="124" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.85" />
    <circle cx="695" cy="56" r="5" fill="#a855f7" />
    <text x="708" y="60" fill="#cbd5e1" font-size="11" font-weight="600">Multiplayer EDA</text>
  </g>

  <!-- FOREGROUND BRANDING / HEADER TEXT (Always crystal clear and in front) -->
  <g>
    <!-- Eyebrow Badge -->
    <rect x="80" y="98" width="220" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
    <text x="190" y="115" fill="#c7d2fe" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title (Gradient Fill) -->
    <text x="80" y="172" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.8">Interactive Data Science</text>
    <text x="80" y="222" fill="#ffffff" font-size="42" font-weight="900" letter-spacing="-0.8">Notebooks</text>

    <!-- Subtitle (Clean high-contrast typography) -->
    <text x="80" y="265" fill="#94a3b8" font-size="16" font-weight="400">
      The ultimate guide to SaaS platforms, reactive Python kernels &amp; self-hosted data science workspaces.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(80, 288)">
      <rect x="0" y="0" width="112" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="56" y="17" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">⚡ Reactive DAG</text>

      <rect x="122" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="191" y="17" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">👥 Real-Time Collab</text>

      <rect x="270" y="0" width="116" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="328" y="17" fill="#f472b6" font-size="11" font-weight="600" text-anchor="middle">📊 Data Apps</text>

      <rect x="396" y="0" width="132" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="462" y="17" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">☁️ Lakehouse Native</text>
    </g>
  </g>
</svg>
